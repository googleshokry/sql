name: Mobile apps (Android APK + iOS)

# البناء يدوي من تبويب Actions، أو تلقائي عند تعديل كود التطبيق.
# رابط السيرفر الافتراضي داخل التطبيق يتحدد من متغير المستودع API_URL
# (Settings → Secrets and variables → Actions → Variables)، ويمكن تغييره من داخل التطبيق.

on:
  push:
    paths: ['mobile_app/**', '.github/workflows/mobile-apps.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط السيرفر (مثال: https://pos.example.com)'
        required: false

env:
  FLUTTER_VERSION: '3.50.1'
  API_URL: ${{ inputs.api_url || vars.API_URL || 'http://10.0.2.2:8000' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build full app (customer + staff)
        run: flutter build apk --release --flavor full --dart-define=API_URL=$API_URL
      - name: Build driver app
        run: flutter build apk --release --flavor driver -t lib/main_driver.dart --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-full-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-driver-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-driver-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # بناء بدون توقيع — للتثبيت على iPhone لازم توقيع بحساب Apple Developer (راجع README)
      - name: Build & package full app
        run: |
          flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL
          rm -rf Payload && mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr restaurant-pos-unsigned.ipa Payload
      # نسخة الطيار على iOS بنفس الـ Bundle ID — لنشرها كتطبيق منفصل غيّر الـ Bundle ID في Xcode
      - name: Build & package driver app
        run: |
          flutter build ios --release --no-codesign -t lib/main_driver.dart --dart-define=API_URL=$API_URL
          rm -rf Payload && mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr restaurant-driver-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-ios-unsigned
          path: mobile_app/restaurant-pos-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-driver-ios-unsigned
          path: mobile_app/restaurant-driver-unsigned.ipa
